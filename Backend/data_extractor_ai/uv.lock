[[package]]
name = "data-extractor-ai"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "pymupdf" },
    { name = "python-dotenv" },
    { name = "tqdm" },
]

[package.optional-dependencies]
cpu = [
    { name = "torch", version = "2.14.0", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "(sys_platform == 'darwin' and extra == 'extra-17-data-extractor-ai-cpu') or (extra == 'extra-17-data-extractor-ai-cpu' and extra == 'extra-17-data-extractor-ai-gpu')" },
    { name = "torch", version = "2.14.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "(sys_platform != 'darwin' and extra == 'extra-17-data-extractor-ai-cpu') or (extra == 'extra-17-data-extractor-ai-cpu' and extra == 'extra-17-data-extractor-ai-gpu')" },
    { name = "torchvision", version = "0.29.0", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "(sys_platform == 'darwin' and extra == 'extra-17-data-extractor-ai-cpu') or (extra == 'extra-17-data-extractor-ai-cpu' and extra == 'extra-17-data-extractor-ai-gpu')" },
    { name = "torchvision", version = "0.29.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "(sys_platform != 'darwin' and extra == 'extra-17-data-extractor-ai-cpu') or (extra == 'extra-17-data-extractor-ai-cpu' and extra == 'extra-17-data-extractor-ai-gpu')" },
]
gpu = [
    { name = "torch", version = "2.6.0+cu124", source = { registry = "https://download.pytorch.org/whl/cu124" } },
    { name = "torchvision", version = "0.21.0+cu124", source = { registry = "https://download.pytorch.org/whl/cu124" } },
]

[package.dev-dependencies]
dev = [
    { name = "easyocr" },
    { name = "label-studio" },
]

[package.metadata]
requires-dist = [
    { name = "pymupdf", specifier = ">=1.28.2" },
    { name = "python-dotenv", specifier = ">=1.2.3" },
    { name = "torch", marker = "extra == 'cpu'", index = "https://download.pytorch.org/whl/cpu", conflict = { package = "data-extractor-ai", extra = "cpu" } },
    { name = "torch", marker = "extra == 'gpu'", index = "https://download.pytorch.org/whl/cu124", conflict = { package = "data-extractor-ai", extra = "gpu" } },
    { name = "torchvision", marker = "extra == 'cpu'", index = "https://download.pytorch.org/whl/cpu", conflict = { package = "data-extractor-ai", extra = "cpu" } },
    { name = "torchvision", marker = "extra == 'gpu'", index = "https://download.pytorch.org/whl/cu124", conflict = { package = "data-extractor-ai", extra = "gpu" } },
    { name = "tqdm", specifier = ">=4.70.1" },
]
provides-extras = ["cpu", "gpu"]

[package.metadata.requires-dev]
dev = [
    { name = "easyocr", specifier = ">=1.7.2" },
    { name = "label-studio", specifier = ">=1.23.1" },
]

